<nav class="navbar-container">

    <button type="button" class="btn-menu" (click)="abrirMenu()">

        <i class="pi pi-bars"></i>

    </button>

    <div class="contenedor-navbar">
        <div class="titulo">
            <p>Panel Principal</p>
            <p>Resumen ejecutivo del control y flujo de Gas Licuado de Petróleo</p>
        </div>
        @if(connection.estado() !== 'offline'){
        <div class="online">
            <div class="alerta_online">
                <ul>
                    <li>SISTEMA EN LÍNEA</li>
                </ul>
            </div>
        </div>
        }@else{
        <div class="offline">
            <div class="alerta_offline">
                <ul>
                    <li>SIN CONEXIÓN</li>
                </ul>
            </div>
        </div>
        }
        <div class="notificacion ">
            <div class="card flex justify-content-center gap-2">
                <p-toast />
                <p-confirmpopup>
                    <ng-template pTemplate="content" let-message>
                        <div
                            class="flex flex-column align-items-center w-full gap-3 border-bottom-1 surface-border p-3 mb-3">
                            <i [class]="message.icon" class="text-6xl text-primary-500"></i>
                            <p>{{ message.message }}</p>
                        </div>
                    </ng-template>
                </p-confirmpopup>
                <p-button (onClick)="confirm($event)" class="notificacion_icon">
                    <i class="pi pi-bell"></i>
                </p-button>
            </div>
            &nbsp;&nbsp;&nbsp;&nbsp;
            <button type="button" class="btn-theme" (click)="cambiarTema()" [title]="
                    themeService.darkMode()
                    ? 'Cambiar a modo claro'
                    : 'Cambiar a modo oscuro'
                ">

                @if (themeService.darkMode()) {

                <i class="pi pi-sun"></i>

                } @else {

                <i class="pi pi-moon"></i>

                }

            </button>
            <!-- <div class="notificacion_icon">
                <i class="pi pi-moon"></i>
            </div> -->
        </div>
        <div class="perfil" routerLink="/perfil">
            <div class="perfil_datos">
                <i class="pi pi-user"></i>
                PERFIL
            </div>
        </div>
    </div>

</nav>
